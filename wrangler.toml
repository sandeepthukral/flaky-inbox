name = "flaky-inbox"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flaky-inbox"
# Placeholder: replace with the real id from `wrangler d1 create flaky-inbox` at deploy time.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flaky-inbox-attachments"

# Secrets (never put here; set with `wrangler secret put`): API_TOKENS, ACCESS_TEAM_DOMAIN, ACCESS_AUD.
# Dashboard plain-text vars would be wiped by `wrangler deploy`.
[vars]
ALLOWED_DOMAINS = "ecom-staging.flaky-tests.uk,ecom-production.flaky-tests.uk"
API_HOST = "mail-api.flaky-tests.uk"
UI_HOST = "mailinat.flaky-tests.uk"
UI_ORIGIN = "https://mailinat.flaky-tests.uk"
RETENTION_HOURS = "72"
STATS_RETENTION_DAYS = "90"
MAX_MESSAGE_BYTES = "10485760"
MAX_ATTACHMENTS = "10"
MAX_ATTACHMENT_BYTES = "5242880"
MAX_BODY_BYTES = "1048576"
UI_AUTH_MODE = "access"
